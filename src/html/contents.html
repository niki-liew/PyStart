    <div class="flexboxFill bgDarkBlue">
        <div class="flexboxFillv center">
            <button onclick="send(1)"><h3>Lesson 1, Variables</h3></button>

            <button onclick="send(2)"><h3>Lesson 2, Print</h3></button>

            <button onclick="send(3)"><h3>Lesson 3, Math</h3></button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="..\main.js"></script>
<script>

async function send(num)
{
    if (onLesson >= num)
    {
        await updateData(currentUID, {
            select: num
        })
        window.location.href = 'specific.html'
    }
    else
    {
        popup("You have not reached that lesson yet.")
    }   
}

let currentUID = null;
let onLesson = 1;

auth.onAuthStateChanged(async user => {

    if (!user) {
        window.location.href = "logIn.html";
        return;
    }
    else
    {
        currentUID = user.uid;
    }

    const dataPromise = loadData(user.uid)
    const [data] = await Promise.all([dataPromise])

    onLesson = data.onLesson || 1

    if (!data.onLesson)
    {
        await updateData(currentUID, {
            onLesson: 1
        })
    }
});
</script>
