<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="..\main.js"></script>
<script>
    const welcText = document.getElementById("welcText");
    const statText = document.getElementById("statText")

    auth.onAuthStateChanged(async user => {

        if (!user) {
            window.location.href = "logIn.html";
            return;
        }

        const data = await loadData(user.uid);

        welcText.innerHTML = `<h1 style="font-size:400%;" class="center" style=" color: #5ac0ff">Welcome, ${data.uName}</h1>`;
        

        const createdAt = data.createdAt;
        const ageMs = Date.now() - createdAt;
        const ageDays = Math.floor(ageMs / (1000 * 60 * 60 * 24));

        statText.innerHTML = `<h1>Account Age: ${ageDays} Days <br> <br> <br> Points: ${data.points} <br> Level: ${Math.floor(data.points / 100)} </h1>`;
    
        const leaderboardDiv = document.getElementById("leaderboard");

        loadLeaderboard().then(users => {

            let html = "<h1>Leaderboard (Points)</h1>";

            users.forEach((user, index) => {

                html += `
                    <p>
                        #${index + 1}
                        ${user.uName}: ${user.points || 0}
                    </p>
                `;
            });

            leaderboardDiv.innerHTML = html;
        });

    });
</script>
