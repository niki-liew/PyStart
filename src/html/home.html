<script>
const welcText = document.getElementById("welcText");
const statText = document.getElementById("statText");
const leaderboardDiv = document.getElementById("leaderboard");
const aiComments = document.getElementById("aiComments")

let lessonChart = null;

function getLessonComments(analysis, lesson) {
    const data = analysis[lesson];

    let comments = [];
    let current = [];

    for (const item of data) {
        if (item === "@") {

            if (current.length >= 4) {
                const comment = current[3];
                if (comment) comments.push(comment);
            }

            current = [];
        } else {
            current.push(item);
        }
    }

    return comments.join(" ");
}

function generateGraphs(analysis) {

    const select = document.getElementById("lessonSelect");

    select.innerHTML = "";

    Object.keys(analysis)
    .sort((a, b) => {
        const numA = parseInt(a.replace("l", ""));
        const numB = parseInt(b.replace("l", ""));
        return numA - numB;
    })
    .forEach(lesson => {
        const option = document.createElement("option");
        option.value = lesson;
        option.textContent = lesson.toUpperCase();
        select.appendChild(option);
    });

    async function loadLesson(lesson) {
        const data = analysis[lesson];

        const durations = [];
        const scores = [];

        let current = [];

        for (const item of data) {
            if (item === "@") {

                if (current.length >= 3) {
                    const startTime = Number(current[0]);
                    const endTime = Number(current[1]);
                    const score = Number(current[2]);

                    durations.push(
                        (endTime - startTime) / (1000 * 60)
                    );

                    scores.push(score);
                }

                current = [];
            } else {
                current.push(item);
            }
        }

        if (lessonChart) {
            lessonChart.destroy();
        }

        lessonChart = new Chart(
            document.getElementById("lessonChart"),
            {
                type: "line",
                data: {
                    labels: durations.map((_, i) => `Attempt ${i + 1}`),
                    datasets: [
                        {
                            label: "Duration (min)",
                            data: durations,
                            yAxisID: "durationAxis",
                            tension: 0.2
                        },
                        {
                            label: "Score",
                            data: scores,
                            yAxisID: "scoreAxis",
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: {
                        durationAxis: {
                            type: "linear",
                            position: "left",
                            title: {
                                display: true,
                                text: "Minutes"
                            }
                        },

                        scoreAxis: {
                            type: "linear",
                            position: "right",

                            min: 0,
                            max: 100,

                            grid: {
                                drawOnChartArea: false
                            },

                            title: {
                                display: true,
                                text: "Score"
                            }
                        }
                    }
                }
            }
        );

        if (getLessonComments(analysis, lesson) != "")
        {
            let comment = await sendMessage("Summarise the comments here to lesser than 150 words. Here are the comments: " + getLessonComments(analysis, lesson))

            aiComments.innerHTML = comment
        }
        else
        {
            aiComments.innerHTML = ""
        }
    }

    select.addEventListener("change", () => {
        loadLesson(select.value);
    });

    if (select.options.length > 0) {
        loadLesson(select.value);
    }
}

auth.onAuthStateChanged(async user => {

    if (!user) {
        window.location.href = "logIn.html";
        return;
    }

    // 🚀 run everything at the same time (FAST)
    const dataPromise = loadData(user.uid);
    const rankPromise = getUserRank(user.uid);
    const leaderboardPromise = loadLeaderboard();

    const [data, uRank, leaderboard] =
        await Promise.all([dataPromise, rankPromise, leaderboardPromise]);

    // =========================
    // 👋 WELCOME TEXT
    // =========================
    welcText.innerHTML =
        `<h1 style="font-size:400%;">Welcome, ${data.uName || "User"}</h1>`;

    // =========================
    // ⏱ ACCOUNT AGE + STATS
    // =========================
    const ageMs = Date.now() - (data.createdAt || Date.now());
    const ageDays = Math.floor(ageMs / (1000 * 60 * 60 * 24));

    const points = data.points || 0;
    const onLesson = data.onLesson || 1

    const analysis = data.analysis

    statText.innerHTML = `
        <h1>
            Account Age: ${ageDays} Days <br><br>
            Points: ${points} <br>
            Level: ${Math.floor(points / 100)} <br>
            On Lesson: ${onLesson}
        </h1>
    `;

    // =========================
    // 🏆 LEADERBOARD
    // =========================
    let html = "<h1>Leaderboard (Points)</h1>";

    html += `<h2>Your Rank: #${uRank || "?"} (${data.uName})</h2>`;

    leaderboard.forEach((u, index) => {
        html += `
            <p>
                #${index + 1}
                ${u.uName || "Unknown"}: ${u.points || 0}
            </p>
        `;
    });

    leaderboardDiv.innerHTML = html;

    Chart.defaults.font.family = "Cascadia Mono, monospace";
    Chart.defaults.color = "white";

    generateGraphs(analysis);
});
</script>
